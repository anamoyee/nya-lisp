[project]
name            = 'nya-lisp'
dynamic         = ['version']
description     = "A customizable lisp-like execution/templating engine, inspired by RoboTop (robotop.xyz) which was made by Colon (gdcolon.com) r!execute"
readme          = "README.md"
requires-python = ">=3.14"

dependencies = [ #
	"nya_scope>=0.3.1",
]

[project.scripts]
nya_lisp = "nya_lisp.__main__:cli"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path    = "src/nya_lisp/_version.py"
pattern = '__version__(?:: str)? *= *\"(?P<version>[^\"]+)\"'

[dependency-groups]
dev = [
    "nya-fmt>=0.1.1",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "ty>=0.0.69",
]
